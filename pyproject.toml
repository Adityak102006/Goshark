[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goshark"
version = "0.1.0"
requires-python = ">=3.10,<3.16"
dependencies = ["PySide6==6.12.0"]

[project.gui-scripts]
goshark = "goshark.app:main"

[tool.setuptools.packages.find]
include = ["goshark*"]

[tool.setuptools.package-data]
goshark = ["assets/*.png"]
