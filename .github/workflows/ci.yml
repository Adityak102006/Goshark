name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-engine-and-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpcap-dev libxkbcommon0 xkb-data libegl1 libgl1
      - name: Test and build Go engine
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./...
      - name: Install desktop package
        run: python -m pip install .
      - name: Test native Qt desktop components
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q goshark tests
          python -m unittest discover -s tests -v
